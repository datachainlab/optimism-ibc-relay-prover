name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  # The devnet runs L1 on the official geth release.
  DEVNET_REF: v1.6.0-rc5
  # The op-stack tag the devnet builds from. Must match what the preimage maker at
  # PREIMAGE_MAKER_REF is tested against, since its derivation has to agree with the
  # chain it reads. op-node/v1.19.8 is the same commit as op-reth/v2.5.0.
  OP_TAG: op-node/v1.19.8
  PREIMAGE_MAKER_REF: 0.5.0-rc2
  # Must match what optimism-devnet's kurtosis SDK expects (see its README).
  KURTOSIS_VERSION: 1.18.1

jobs:
  test:
    name: test
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Clean up unnecessary packages
        run: |
          sudo rm -rf "/usr/share/dotnet" || true
          sudo rm -rf "/usr/local/lib/android" || true
          sudo rm -rf "/usr/local/share/boost" || true
          docker system prune -a --volumes -f
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: extractions/setup-just@v2
        with:
          just-version: 1.40.0
      - name: Clean up unnecessary docker volumes
        run: |
          docker system prune -a --volumes -f
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 'v1.0.0'
      - name: Install kurtosis
        # The apt repo at apt.fury.io stops at 1.15.2, so install the release tarball
        # instead. optimism-devnet's kurtosis SDK refuses to talk to an older engine.
        run: |
          sudo apt-get install -y jq
          curl -fsSL -o /tmp/kurtosis.tar.gz \
            "https://github.com/kurtosis-tech/kurtosis-cli-release-artifacts/releases/download/${KURTOSIS_VERSION}/kurtosis-cli_${KURTOSIS_VERSION}_linux_amd64.tar.gz"
          sudo tar -C /usr/local/bin -xzf /tmp/kurtosis.tar.gz kurtosis
          kurtosis version
      - name: Download optimism-devnet
        run: |
          git clone -b ${DEVNET_REF} https://github.com/datachainlab/optimism-devnet
      - name: Download optimism-preimage-maker
        run: |
          git clone -b ${PREIMAGE_MAKER_REF} https://github.com/datachainlab/optimism-preimage-maker
      - name: Start optimism dev net
        # The devnet pins the L1 clients itself; only the op-stack tag is chosen here.
        run: |
          cd optimism-devnet
          make chain OP_TAG=${OP_TAG}
          make devnet-up
      - name: Set port
        run: |
          cd optimism-preimage-maker
          make set-port
      - name: Deploy contracts
        run: |
          make set-port
          make contracts
        env:
          PREIMAGE_MAKER: ./
      - name: Start preimage server
        run: |
          cd optimism-preimage-maker
          make server-up &
          make wait
      - name: Clean up cache
        run: |
          sudo rm -rf $HOME/.cargo/registry
          sudo rm -rf $HOME/.cache
      - name: Test
        run: |
          sleep 180
          go test ./module/...
        env:
          PREIMAGE_MAKER: ./

